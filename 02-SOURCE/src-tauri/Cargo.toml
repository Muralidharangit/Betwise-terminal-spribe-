[package]
name = "app"
version = "0.1.0"
description = "Betwise Betting Kiosk (Tauri)"
authors = ["Betwise"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Avoid libudev system dep — open /dev/ttyUSB* by path (same as Electron serialport usage)
serialport = { version = "4", default-features = false }

# Linux: read the USB printer's status (paper, error) and write without blocking.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.5"

# Windows: RAW printing through the spooler so any receipt printer with a driver works.
# Also: low-level keyboard hook to block Win/Alt+Tab while kiosk is locked.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Dependencies (Tauri, WebKit bindings, serial) run optimised even in `tauri dev`;
# only this crate stays at debug level so rebuilds stay quick.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
